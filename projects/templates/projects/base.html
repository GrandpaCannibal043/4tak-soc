<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>4tak – Projekty SOČ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* =========================
   FAREBNÁ PALETA
========================= */
        :root {
            --green: #22c55e;
            --green-dark: #15803d;
            --black: #000000;
            --white: #ffffff;
            --gray-bg: #f1f5f9;
            --gray-text: #475569;
        }

        /* =========================
        ZÁKLAD
        ========================= */
        body {
            margin: 0;
            font-family: "Inter", Arial, Helvetica, sans-serif;
            color: #0f172a;

            /* jemný tmavší gradient podklad */
            background:
                radial-gradient(
                    ellipse at top,
                    #f8fafc 0%,
                    #f1f5f9 55%,
                    #f1f5f9 100%
        );
}

        /* =========================
        HEADER
        ========================= */
        header {
            position: relative;
            background-color: var(--black);
            border-bottom: 3px solid var(--green);
            padding: 25px 0;
        }

        header h2 {
            color: white;
            font-weight: 800;
            letter-spacing: 1px;
            margin: 0;
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px; /* 👈 kľúčové */
        }


        /* =========================
        NAVIGÁCIA
        ========================= */
        nav {
            margin-top: 12px;
        }

        nav a {
            position: relative;
            color: #e5e7eb;
            margin: 0 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            padding-bottom: 6px;
        }

        nav a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 0%;
            height: 2px;
            background-color: var(--green);
            transition: width 0.25s ease;
        }

        nav a:hover {
            color: var(--green);
        }

        nav a:hover::after {
            width: 100%;
        }

        /* =========================
        HAMBURGER DROPDOWN MENU
        ========================= */

        .hamburger {
            font-size: 26px;
            color: white;
            cursor: pointer;
            user-select: none;
        }

        /* malé menu */
        .nav-menu {
            position: absolute;
            top: 70px;
            right: 20px;
            background-color: #000;
            border: 2px solid var(--green);
            border-radius: 14px;
            padding: 14px 20px;
            min-width: 180px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            display: none;
            z-index: 1000;
        }

        .nav-menu a {
            display: block;
            padding: 10px 0;
            color: #e5e7eb;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
        }

        .nav-menu a:hover {
            color: var(--green);
        }

        /* zobrazenie */
        .nav-menu.show {
            display: block;
        }


        /* ❌ ZRUŠENÝ CTA ŠTÝL V HEADERI */
        /* nav a.cta { ... } ZÁMERNE ODSTRÁNENÉ */


        /* =========================
        HLAVNÝ OBSAH
        ========================= */
        .container {
            max-width: 1100px;
            margin: 80px auto;
            padding: 0 20px;
        }

        /* HERO – stred stránky */
        .hero {
            max-width: 800px;
            margin: 0 auto 80px auto;
            text-align: center;
        }

        .hero p {
            margin-left: auto;
            margin-right: auto;
        }

        /* =========================
        TYPOGRAFIA
        ========================= */
        h1 {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        h2 {
            font-weight: 700;
            margin-top: 40px;
        }

        p {
            color: var(--gray-text);
            line-height: 1.7;
            max-width: 720px;
        }

        /* =========================
        OSTROVČEKY (FEATURES)
        ========================= */
        .features {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 30px;
        }

        .feature {
            background-color: white;
            padding: 32px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            transition: all 0.25s ease;
            text-align: left;
        }

        .feature:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 45px rgba(0,0,0,0.12);
        }

        .feature h3 {
            margin-top: 0;
            font-weight: 700;
            margin-bottom: 10px;
        }

        /* =========================
        KARTY (PROJEKTY, DETAILY)
        ========================= */
        .card {
            background-color: white;
            border-radius: 18px;
            padding: 32px;
            border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            margin-bottom: 30px;
            transition: all 0.25s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 45px rgba(0,0,0,0.12);
        }

        /* =========================
        BUTTONY – KOMPATIBILNÝ SYSTÉM
        ========================= */

        /* spoločný základ */
        .btn,
        .btn-primary,
        .btn-outline-secondary,
        .btn-success,
        .btn-outline-success {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            padding: 12px 26px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 15px;
            text-decoration: none;
            cursor: pointer;

            border: 2px solid transparent;
            transition: all 0.2s ease;
        }

        /* ZELENÝ – PLNÝ */
        .btn-green,
        .btn-primary,
        .btn-success {
            background-color: var(--green);
            color: white;
            border-color: var(--green);
        }

        .btn-green:hover,
        .btn-primary:hover,
        .btn-success:hover {
            background-color: var(--green-dark);
            border-color: var(--green-dark);
        }

        /* ZELENÝ – OUTLINE */
        .btn-green-outline,
        .btn-outline-secondary,
        .btn-outline-success {
            background-color: transparent;
            color: var(--green);
            border-color: var(--green);
        }

        .btn-green-outline:hover,
        .btn-outline-secondary:hover,
        .btn-outline-success:hover {
            background-color: var(--green);
            color: white;
        }

        /* SIVÝ */
        .btn-gray-outline {
            background-color: transparent;
            color: #64748b;
            border-color: #cbd5e1;
        }

        .btn-gray-outline:hover {
            background-color: #e5e7eb;
            color: #0f172a;
        }

        /* full width */
        .btn-full {
            width: 100%;
        }

        /* =========================
        ZRUŠENIE MODRÉHO :visited PRE BUTTONY
        ========================= */


        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 48px;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 14px;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: var(--green);
        }

        .toggle-password:hover {
            color: var(--green-dark);
        }

        /* =========================
        BADGES
        ========================= */
        .badge.bg-primary {
            background-color: var(--green) !important;
        }

        .badge.bg-secondary {
            background-color: #1f2937 !important;
        }

        /* =========================
        FOOTER
        ========================= */
        footer {
            background-color: #e5e7eb;
            color: #64748b;
            padding: 20px;
            text-align: center;
            font-size: 14px;
            margin-top: 80px;
        }

        /* =========================
            CAPTCHA – REGISTRÁCIA
        ========================= */

        .captcha-wrapper img {
            display: block;
            margin-bottom: 10px;
            height: 60px;           /* zväčšenie obrázka */
            max-width: 100%;
        }

        .captcha-wrapper input {
            width: 100%;
            font-size: 18px;        /* väčší text */
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
        }

        .captcha-wrapper input:focus {
            outline: none;
            border-color: #22c55e;
            box-shadow: 0 0 0 2px rgba(34,197,94,0.25);
        }

        /* =========================
        AMBIENT GLOW POZADIE
        ========================= */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;

            background:
                radial-gradient(
                    circle at top,
                    rgba(34, 197, 94, 0.12),
                    transparent 45%
        );
}

        header,
        .container,
        footer {
            position: relative;
            z-index: 1;
        }

        .card,
.feature {
    box-shadow:
        0 10px 30px rgba(0,0,0,0.08),
        0 0 0 1px rgba(0,0,0,0.02);
}

.card:hover,
.feature:hover {
    box-shadow:
        0 20px 60px rgba(0,0,0,0.12),
        0 0 40px rgba(34,197,94,0.12);
}



        
    </style>
</head>

<script>
function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);

    if (input.type === "password") {
        input.type = "text";
        btn.textContent = "🙈";
    } else {
        input.type = "password";
        btn.textContent = "👁";
    }
}
</script>

<body>

<header>
    <div class="header-inner">
        <h2>4tak</h2>
        <div class="hamburger" onclick="toggleMenu()">☰</div>
    </div>

    <div id="navMenu" class="nav-menu">
        <a href="{% url 'index' %}">Domov</a>
        <a href="{% url 'project_list' %}">Projekty</a>

        {% if user.is_authenticated %}
            <a href="{% url 'add_project' %}">Pridať projekt</a>
            <a href="{% url 'my_projects' %}">Moje projekty</a>
            <a href="{% url 'logout' %}">Odhlásiť</a>
        {% else %}
            <a href="{% url 'login' %}">Prihlásenie</a>
            <a href="{% url 'register' %}">Registrácia</a>
        {% endif %}
    </div>
</header>


<div class="container">
    {% block content %}{% endblock %}
</div>

<footer>
    © 2026 4tak – SOČ platforma | Študentský projekt
</footer>

<script>
function toggleMenu() {
    document.getElementById("navMenu").classList.toggle("show");
}
</script>


</body>
</html>
